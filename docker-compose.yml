services:
  postgres:
    image: postgres:16-alpine
    container_name: hcp-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hcp_crm
      POSTGRES_PASSWORD: hcp_crm_password
      POSTGRES_DB: hcp_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcp_crm -d hcp_crm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
